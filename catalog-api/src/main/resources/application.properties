server.port=8080

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/catalog_db}
spring.datasource.username=${DB_USERNAME:catalog_user}
spring.datasource.password=${DB_PASSWORD:catalog_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JWT
jwt.secret=${JWT_SECRET:catalog-secret-key-dev-2026-must-be-at-least-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Upload de Imagens
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/imagens
app.upload.max-images-per-product=5

# Stream Chat API
stream.chat.api-key=${STREAM_CHAT_API_KEY:}
stream.chat.api-secret=${STREAM_CHAT_API_SECRET:}
