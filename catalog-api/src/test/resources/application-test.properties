# Perfil de teste: H2 em memória (schema gerado pelas entidades), sem Flyway e sem Redis.
# jwt.secret NÃO é definido aqui de propósito: JwtSecretObrigatorioTest depende disso.
spring.datasource.url=jdbc:h2:mem:catalog;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.cache.type=none
