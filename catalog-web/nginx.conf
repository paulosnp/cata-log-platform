server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA: React Router (client-side routing) ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy Reverso: API Spring Boot ──
    # Todas as chamadas /api/v1/* são encaminhadas para o container catalog-api
    # Isso elimina problemas de CORS em produção (mesmo domínio)
    location /api/v1/ {
        proxy_pass http://catalog-api:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para upload de imagens e operações lentas
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Tamanho máximo de upload (imagens de produto)
        client_max_body_size 10M;
    }

    # ── Proxy: Imagens estáticas de produtos ──
    # ^~ garante prioridade sobre o bloco regex de cache de assets
    location ^~ /imagens/ {
        proxy_pass http://catalog-api:8080/imagens/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Cache de assets estáticos ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Compressão Gzip ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
